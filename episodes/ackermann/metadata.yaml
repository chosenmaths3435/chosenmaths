long:
  title: "The function no for-loop can compute (The Ackermann Function)"
  title_alternatives:
    - "Too big for any for-loop: the Ackermann function"
    - "Addition, multiplication, powers... what comes next?"
  description: |
    Addition is repeated counting, multiplication is repeated addition, and powers are repeated multiplication. Keep going and you get the Ackermann function, defined by three short rules. A(4, 2) already has 19,729 digits, and A(4, 3) has more digits than there are atoms in the universe.
    Programs built only from bounded loops, loops that fix their count before they start, compute almost everything you would ever want: factorials, primes, the n-th prime. These are the primitive recursive functions, and every one of them always stops. But each loop only climbs about one row of the Ackermann table, so walking the table diagonally outruns every such program. The Ackermann function is computable and always stops, yet no bounded-loop program computes it.
    Then: why it always stops (a countdown in dictionary order), how loops that build functions get it back, and why every language where all programs stop, and a computer can list and run them, must miss some computable function.
    The two-argument version here is due to Rozsa Peter and Raphael Robinson, after Wilhelm Ackermann's 1928 original. Loops over functions are the idea behind Godel's System T.

