long:
  title: "So... what actually is √2?"
  title_alternatives:
    - "The Square Root of 2 Is a Set of Lists"
    - "Where Do the Real Numbers Come From?"
  description: |
    No fraction squares to 2. The Pythagoreans knew it, and here's a picture proof you can see. So what is the square root of 2? Lists of fractions like 1, 1.4, 1.41, 1.414, ... close in on a spot where no fraction lives. Let the list be the number, group together the lists that close in on the same spot, and you've built the real numbers. Change how you measure closeness and the same idea builds entirely different number systems, like one where 1 + 2 + 4 + 8 + ... = -1.

    {chapters}

    Animation source and script: {repo_url}

    #CauchySequences #RealNumbers #EquivalenceClasses #Completion #pAdicNumbers #RealAnalysis #Irrational
