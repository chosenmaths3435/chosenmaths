long:
  title: "How to solve infinitely many problems at once (The Compactness Theorem)"
  title_alternatives:
    - "The compactness theorem: from finite to infinite"
    - "Infinitesimals, coloring the plane, and compactness"
  description: |
    How do you solve infinitely many problems at the same time? Just solve every finite number of them. The compactness theorem of logic says this works, as long as you are willing to change the world you solve them in.
    We set up the background: languages, models, and what it means for a model to satisfy a sentence. Then two applications. Keeping every true statement about the real numbers and adding a number smaller than every 1/n gives a number system with infinitesimals, the numbers Leibniz built calculus on. And coloring the plane so that points one unit apart get different colors: compactness says that if the plane needs five colors, some finite set of points already does, which is exactly what Aubrey de Grey found in 2018.
    Then a proof sketch with ultraproducts and Los's theorem, and the link to topology: a space is compact when closed sets that always overlap in finite bunches all overlap at once. Tychonoff's theorem proves the coloring result directly, and the compactness theorem says a space of complete descriptions is compact.

    {chapters}

