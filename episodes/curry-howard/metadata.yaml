long:
  title: "Every proof is a program: the Curry-Howard correspondence"
  title_alternatives:
    - "Proofs are programs, from P implies Q to homotopy type theory"
    - "The one law of logic that won't run"
  description: |
    A proof that P implies Q is a function. A proof of "P and Q" is a pair. A proof by induction is a recursive program, and you can run it. We build the Curry-Howard correspondence up from propositional logic to dependent types in Lean, and watch the type system grow as the logic says more. Along the way: why "P or not P" has no program (it would solve the halting problem), a theorem about binary numbers that prints its own answer, the equality type and its induction principle, and why two proofs of the same equation can be different, which is where homotopy type theory starts.
    Every Lean snippet in the video compiles; the file is in the source repo.

    {chapters}

    Animation source and script: {repo_url}

    #CurryHoward #TypeTheory #Lean #Logic #ProofsAsPrograms #HoTT #ComputerScience #Math
