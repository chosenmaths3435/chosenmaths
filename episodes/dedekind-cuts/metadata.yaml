long:
  title: "Delete the arithmetic: the real numbers are just an order"
  title_alternatives:
    - "What actually is the real line?"
    - "Only one line has these four properties"
  description: |
    Throw away addition, multiplication and distance, and keep only "less than". That is still enough to rebuild the real line, and there is only one way to do it. We cut the rationals at their holes the way Dedekind did in 1872, show that the filled-in line has no holes left, and run the same construction on other lines. Then Cantor's theorem from 1895: any line with no holes, dense, with no ends and a countable set of points spread through it is the real line. Each of the four facts is needed, and the long line shows why the last one matters. We end on Suslin's question, which the usual axioms of math can neither prove nor disprove.
    This is the third video in a series: "So... what actually is sqrt(2)?" built the reals from lists of fractions, and "What makes the rational numbers so special?" proved that three facts pin down the rationals.

    {chapters}

