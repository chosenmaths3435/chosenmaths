long:
  title: "A divisibility test for any number (Finite State Machines)"
  title_alternatives:
    - "Why adding the digits tests for 3, and what the test for 7 looks like"
    - "Seven dots that check divisibility by 7"
  description: |
    To test for 3 you add the digits, and to test for 5 you look at the last digit. What is the test for 7? A small diagram works for any number n: n dots, one for each remainder, and an arrow for each digit from r to the remainder of 10r + d. Start at 0, follow the digits, and the dot you end on is the remainder.
    For 3 the diagram is the digit-sum rule, because 10 leaves remainder 1. For 5 it forgets everything but the last digit. For 7 the rule is "triple, add the digit, keep the remainder", and for 11 the machine rediscovers the alternating-sum test.
    These diagrams are finite state machines: a fixed set of states, one symbol read at a time, and an answer decided by the state you end in. The inputs a machine accepts form its language, and the languages some finite state machine can recognize are called regular.
    What can't they do? Checking balanced parentheses. A pigeonhole argument shows that any machine with k states mistakes two inputs it should tell apart, so no finite state machine works.

    {chapters}

