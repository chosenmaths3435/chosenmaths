long:
  title: "Godel and Turing proved the same theorem"
  title_alternatives:
    - "The halting problem is the incompleteness theorem in disguise"
    - "What problems can we solve? Turing, Godel, and the limits of reasoning"
  description: |
    In 1930 Hilbert said "We must know. We will know." The day before, Godel had announced that no fixed set of rules can get us there. Six years later Turing proved that no machine can tell which programs halt. One theorem is about proofs and the other is about machines, but they're the same theorem. To ask "what problems can we solve?" you have to define "problem" and "solve". Do it with strings and machines and you get the halting problem. Do it with sentences and proofs and you get incompleteness. We prove both, put them side by side, and get incompleteness straight out of the halting problem.

    {chapters}

