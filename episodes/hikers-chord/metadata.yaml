long:
  title: "Two opposite points on the equator have the same temperature"
  title_alternatives:
    - "Same height, half a loop apart (the universal chord theorem)"
    - "Why a rod 2/5 of a trail long might never fit"
  description: |
    Right now, two opposite points on the equator have exactly the same temperature. The reason fits on a hiking trail.
    Walk a loop trail and track one number: the height half a loop ahead, minus the height where you are. After half a loop, the two spots swap, so the number flips sign, and by the intermediate value theorem it hits zero somewhere. That gives two spots half a loop apart at the same height, and the same argument works around the equator. On the whole globe, the Borsuk-Ulam theorem gives two opposite points with the same temperature and the same air pressure.
    On a loop, every distance works, not just half. But cut the loop open into a trail that starts and ends at the same height, and only distances of one over a whole number are guaranteed. Paul Levy showed in 1934 that every other length, like two fifths of the trail, can fail.

