long:
  title: "Most strings can't be compressed (Kolmogorov Complexity)"
  title_alternatives:
    - "Almost every string is random. Name one."
    - "Why every compressor makes some files bigger"
  description: |
    Every compression program like zip makes some files bigger. It's not a bug: there just aren't enough short files to go around. That counting argument is the start of Kolmogorov complexity, where the complexity of a string is the length of the shortest program that prints it.
    Counting programs shows that almost every string is random, with no description much shorter than itself. The compressible strings are the ones that follow a rule picking out only a few strings, like palindromes, and that is how real compressors win. Then the Berry paradox, "the smallest number that cannot be described in under sixty letters", turns into a proof that no program can compute the complexity of a string.
    Finally, Chaitin's incompleteness theorem: for any fixed axioms there is a bound, about the size of the axioms, past which no specific string can be proven random, even though all but finitely many strings are past it.

