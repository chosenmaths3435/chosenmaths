long:
  title: "Continuous at every irrational, broken at every fraction"
  title_alternatives:
    - "The popcorn function, and the function that can't exist"
    - "Why no function is continuous only at the fractions"
  description: |
    There's a function that's continuous at every irrational number and broken at every fraction. Try to build the opposite. You can't.
    The popcorn function sends a fraction p/q in lowest terms to 1/q and every irrational number to 0. Near a fraction, irrationals sit at zero right next to it, so the graph breaks there. Near an irrational, only fractions with huge denominators survive, and those have tiny values, so the graph is continuous there.
    Then the reverse: no function is continuous at every fraction and broken at every irrational. List the fractions, and run a countdown of shrinking intervals that leaves out one fraction at each step. The point they close in on is irrational, and the function is continuous there. This countdown is the heart of the Baire category theorem.
    The popcorn function is also called Thomae's function, after Carl Johannes Thomae, who described it in 1875.

    {chapters}

