long:
  title: "Can a program print itself? (Quines and the Recursion Theorem)"
  title_alternatives:
    - "A program that prints its own source code, and why that's a theorem"
    - "How to write a program that prints itself"
  description: |
    Can a program print its own source code, without reading its own file? The obvious attempt never ends: to print itself, a program would have to contain a copy of itself, and that copy another copy, and so on.
    The way out is an old trick from language: "Print two copies of the following, the second one in quotes:" followed by that same phrase in quotes. One half is data, the other half is instructions that use the data twice. The same split gives a program SELF = A B, where A writes out the text of B, and B rebuilds A from it. A depends on B, but B never mentions A, so there is no infinite regress.
    The construction works in any programming language; here it is in Python. A relational interpreter written in miniKanren finds the same kind of program on its own: ask it for an expression whose value is itself, and it returns the classic Lisp quine.
    Replace "print" with any program T and you get the recursion theorem: every program can be written as if it could read its own source code. As an application, no program can list all the shortest programs. The same trick builds Godel's sentence that says it has no proof.

    {chapters}

