long:
  title: "There's only one random graph"
  title_alternatives:
    - "Flip a coin for every edge, and you always get the same infinite graph"
    - "The Rado graph: why every infinite random graph is the same"
  description: |
    Flip a coin for every pair of dots: heads, connect them, tails, don't. Do it with infinitely many dots, and with probability one you and I build the exact same network.
    The reason is a property we call granting wishes: for any few dots colored green and red, some other dot is joined to every green one and to no red one. Coin flips grant every wish, and a back-and-forth matching shows that any two graphs that grant every wish are the same graph. So there is really only one random graph, the Rado graph.
    It has strange properties: flip every connection and you get it back, and every finite graph sits inside it. You can even build it without coins, from binary digits. And it explains the zero-one law: any first-order statement about graphs is almost always true or almost always false in big random graphs, and the random graph tells you which.
    Paul Erdos and Alfred Renyi proved the coin-flip result in 1963, and Richard Rado gave the binary construction in 1964. The zero-one law is due to Glebskii, Kogan, Liogon'kii and Talanov (1969) and, independently, Fagin (1976).

