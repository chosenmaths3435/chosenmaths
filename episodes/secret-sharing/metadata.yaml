long:
  title: "Split a secret so any 3 can open it and 2 learn nothing"
  title_alternatives:
    - "Shamir's secret sharing: two points make a line"
    - "How to hide a secret in a parabola (Shamir's Secret Sharing)"
  description: |
    A vault code is split among five managers. Any three of them can open it, but any two together learn nothing at all, not even whether the code is even. The trick is something you learned in school: two points make a line.
    We start with the easy case, where everyone is needed, and see why splitting the secret separately for every group blows up. Then the secret becomes the height where a random line crosses the vertical axis. Two points pin the line down, and one point fits every possible secret. For any three of five, use a parabola; for any k people, a polynomial of degree k minus one.
    With ordinary numbers a single point still leaks a little, because you can't pick a slope fairly from all the real numbers. Doing the arithmetic on a dial with a prime number of positions fixes that, and we see why the number of positions has to be prime. Then two ways to get it wrong, and how the same polynomials catch a manager who lies about their share.
    Adi Shamir published this scheme in 1979. George Blakley found a different one, using planes in space, the same year.

