long:
  title: "Are the real numbers uncountable? Skolem's paradox"
  title_alternatives:
    - "A countable universe where the reals are uncountable"
    - "Skolem's paradox: uncountable from inside, countable from outside"
  description: |
    Set theory proves that the real numbers can't be listed. Logic proves that, if set theory is consistent, there's a whole universe of sets where that theorem is still true, and yet everything in the universe can be listed. This is Skolem's paradox. We build the countable universe with the Lowenheim-Skolem theorem, see why it isn't a contradiction, and ask what a universe can't see about itself, ending with Godel's incompleteness theorem.

    {chapters}

