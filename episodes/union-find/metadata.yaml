long:
  title: "Every equivalence relation is equality in disguise (Union-Find)"
  title_alternatives:
    - "Equality in disguise: equivalence relations and union-find"
    - "A running time that's at most 4, but not constant"
  description: |
    "Listen" and "silent" are anagrams. Sort the letters and both become the same string, so "is an anagram of" turns into plain equals. That works for every equivalence relation: a rule is reflexive, symmetric and transitive exactly when there is a function f with x ~ y if and only if f(x) = f(y).
    The proof sends each x to its equivalence class, but there is often a far better choice. Clock times: the remainder mod 12. Finite-dimensional vector spaces up to isomorphism: the dimension.
    To keep track of an equivalence relation on a computer, it is enough to compute some f fast. A disjoint set forest (union-find) lets each group pick a representative and stores pointers toward it. Union by rank keeps every tree at most log2 n tall. Path compression points every node a search passes straight at the root. Together, m operations on n items take time at most proportional to m times alpha(n), where alpha is the inverse Ackermann function: at most 4 for any input that could ever exist, but still not constant.
    We sketch the easier m log* n bound of Hopcroft and Ullman (1973), and state Tarjan's alpha(n) bound (1975) and the matching lower bound of Fredman and Saks (1989), which holds for any union-find structure in the cell-probe model.
    A note for the precise: the tight bound is in terms of the two-argument alpha(m, n). The m alpha(n) bound in the video is a valid upper bound, and it is tight when m is not much larger than n.

