[project]
name = "math-videos"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "manim>=0.22.1",
    "manim-voiceover>=0.4.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathvid"]
